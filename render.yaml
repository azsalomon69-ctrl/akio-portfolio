services:
  - type: web
    name: akio-portfolio-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      - key: FRONTEND_URL
        sync: false
      - key: AUDIUS_API_KEY
        sync: false
      - key: SOCIAL_ADMIN_EMAIL
        sync: false
      - key: SOCIAL_DATA_DIR
        value: ./data
      - key: SOCIAL_AI_ENABLED
        value: "true"
      - key: SOCIAL_AI_PROACTIVE
        value: "true"
      - key: SOCIAL_AI_MAX_ACTIONS_PER_HOUR
        value: "12"
      - key: NVIDIA_API_KEY_1
        sync: false
      - key: NVIDIA_MODEL_1
        value: openai/gpt-oss-120b
      - key: NVIDIA_API_KEY_2
        sync: false
      - key: NVIDIA_MODEL_2
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_API_KEY_3
        sync: false
      - key: NVIDIA_MODEL_3
        value: openai/gpt-oss-20b
      - key: NVIDIA_API_KEY_4
        sync: false
      - key: NVIDIA_MODEL_4
        value: meta/llama-3.1-8b-instruct
      - key: NVIDIA_API_KEY_5
        sync: false
      - key: NVIDIA_MODEL_5
        value: nvidia/nemotron-3-super-120b-a12b
